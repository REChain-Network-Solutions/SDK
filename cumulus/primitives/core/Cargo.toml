[package]
name = "cumulus-primitives-core"
version = "0.7.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Cumulus related core primitive types and traits"
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }

# Substrate
sp-api = { workspace = true }
sp-runtime = { workspace = true }
sp-trie = { workspace = true }

# Polkadot
rechain-core-primitives = { workspace = true }
rechain-parachain-primitives = { workspace = true }
rechain-primitives = { workspace = true }
xcm = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"rechain-core-primitives/std",
	"rechain-parachain-primitives/std",
	"rechain-primitives/std",
	"scale-info/std",
	"sp-api/std",
	"sp-runtime/std",
	"sp-trie/std",
	"xcm/std",
]
runtime-benchmarks = [
	"rechain-parachain-primitives/runtime-benchmarks",
	"rechain-primitives/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"xcm/runtime-benchmarks",
]

