[package]
name = "test-parachain-undying-collator"
description = "Collator for the undying test parachain"
edition.workspace = true
license.workspace = true
version = "1.0.0"
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "undying-collator"
path = "src/main.rs"

[dependencies]
clap = { features = ["derive"], workspace = true }
codec = { features = ["derive"], workspace = true }
futures = { workspace = true }
futures-timer = { workspace = true }
log = { workspace = true, default-features = true }

rechain-cli = { workspace = true, default-features = true }
rechain-erasure-coding = { workspace = true, default-features = true }
rechain-node-primitives = { workspace = true, default-features = true }
rechain-node-subsystem = { workspace = true, default-features = true }
rechain-primitives = { workspace = true, default-features = true }
rechain-service = { features = ["rococo-native"], workspace = true, default-features = true }
test-parachain-undying = { workspace = true }

sc-cli = { workspace = true, default-features = true }
sc-client-api = { workspace = true, default-features = true }
sc-service = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }

[dev-dependencies]
rechain-node-core-pvf = { features = ["test-utils"], workspace = true, default-features = true }
rechain-parachain-primitives = { workspace = true, default-features = true }
rechain-test-service = { workspace = true }

sc-service = { workspace = true, default-features = true }
sp-keyring = { workspace = true, default-features = true }

tokio = { features = ["macros"], workspace = true, default-features = true }

