[package]
name = "rechain-subsystem-bench"
description = "Subsystem performance benchmark client"
version = "1.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
publish = false

[lib]
name = "rechain_subsystem_bench"
path = "src/lib/lib.rs"

[[bin]]
name = "subsystem-bench"
path = "src/cli/subsystem-bench.rs"

# Prevent rustdoc error. Already documented from top-level Cargo.toml.
doc = false


[dependencies]
assert_matches = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
clap = { features = ["derive"], workspace = true }
color-eyre = { workspace = true }
colored = { workspace = true }
futures = { workspace = true }
futures-timer = { workspace = true }
gum = { workspace = true, default-features = true }
hex = { workspace = true, default-features = true }
jemalloc_pprof = { workspace = true, optional = true }
log = { workspace = true, default-features = true }
rechain-availability-bitfield-distribution = { workspace = true, default-features = true }
rechain-availability-distribution = { workspace = true, default-features = true }
rechain-availability-recovery = { features = ["subsystem-benchmarks"], workspace = true, default-features = true }
rechain-erasure-coding = { workspace = true, default-features = true }
rechain-node-core-av-store = { workspace = true, default-features = true }
rechain-node-core-chain-api = { workspace = true, default-features = true }
rechain-node-network-protocol = { workspace = true, default-features = true }
rechain-node-primitives = { workspace = true, default-features = true }
rechain-node-subsystem = { workspace = true, default-features = true }
rechain-node-subsystem-types = { workspace = true, default-features = true }
rechain-node-subsystem-util = { workspace = true, default-features = true }
rechain-overseer = { workspace = true, default-features = true }
rechain-primitives = { workspace = true, features = ["test"] }
rechain-service = { workspace = true, default-features = true }
rechain-statement-distribution = { workspace = true, default-features = true }
rand = { workspace = true, default-features = true }
sc-keystore = { workspace = true, default-features = true }
sha1 = { workspace = true }
sp-core = { workspace = true, default-features = true }
sp-keystore = { workspace = true, default-features = true }
sp-tracing = { workspace = true }
tikv-jemallocator = { features = ["profiling", "unprefixed_malloc_on_supported_platforms"], workspace = true, optional = true }
# `rand` only supports uniform distribution, we need normal distribution for latency.
bitvec = { workspace = true, default-features = true }
kvdb-memorydb = { workspace = true }
rand_distr = { workspace = true }

clap-num = { workspace = true }
codec = { features = ["derive", "std"], workspace = true, default-features = true }
itertools = { workspace = true }
rechain-node-metrics = { workspace = true, default-features = true }
rechain-node-subsystem-test-helpers = { workspace = true }
rechain-primitives-test-helpers = { workspace = true }
prometheus = { workspace = true }
prometheus-endpoint = { workspace = true, default-features = true }
sc-network = { workspace = true, default-features = true }
sc-network-types = { workspace = true, default-features = true }
sc-service = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sp-application-crypto = { workspace = true, default-features = true }
sp-consensus = { workspace = true, default-features = true }
sp-keyring = { workspace = true, default-features = true }
tokio = { features = ["parking_lot", "rt-multi-thread"], workspace = true, default-features = true }

rechain-approval-distribution = { workspace = true, default-features = true }
rechain-node-core-approval-voting = { workspace = true, default-features = true }
rechain-node-core-approval-voting-parallel = { workspace = true, default-features = true }
sp-consensus-babe = { workspace = true, default-features = true }
sp-runtime = { workspace = true }
sp-timestamp = { workspace = true, default-features = true }

schnorrkel = { workspace = true }
# rand_core should match schnorrkel
orchestra = { features = ["futures_channel"], workspace = true }
paste = { workspace = true, default-features = true }
pyroscope = { workspace = true }
pyroscope_pprofrs = { workspace = true }
rand_chacha = { workspace = true, default-features = true }
rand_core = { workspace = true }
strum = { features = ["derive"], workspace = true, default-features = true }

[features]
default = []
memprofile = [
	"dep:jemalloc_pprof",
	"dep:tikv-jemallocator",
]

