name: Security issue
description: Report a security vulnerability (prefer email per SECURITY.md)
labels: [security]
title: "security: "
body:
  - type: markdown
    attributes:
      value: |
        Please follow responsible disclosure and email `security@rechain.network` as described in `SECURITY.md`. If you still prefer to open an issue, avoid sharing sensitive exploit details.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What is the impact and severity?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction (sanitized)
      description: Minimal steps without sensitive data.
