name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: '🚀 Features'
    labels: ['feat', 'feature', 'enhancement']
  - title: '🐛 Fixes'
    labels: ['fix', 'bug']
  - title: '🧰 Maintenance'
    labels: ['chore', 'build', 'ci', 'docs', 'refactor', 'perf', 'test']
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\\|'
exclude-labels:
  - 'skip-changelog'
template: |
  ## Changes
  $CHANGES
