name: cspell
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: streetsidesoftware/cspell-action@v6
        with:
          config: cspell.json
          incremental_files_only: false
