name: hadolint
on:
  push:
    branches: [ main ]
    paths:
      - '**/*.Dockerfile'
      - 'docker/**'
  pull_request:
    paths:
      - '**/*.Dockerfile'
      - 'docker/**'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: '**/*.Dockerfile'
