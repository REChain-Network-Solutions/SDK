name: Lock Threads
on:
  schedule:
    - cron: '0 1 * * *'
permissions:
  issues: write
  pull-requests: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v5
        with:
          issue-inactive-days: '30'
          pr-inactive-days: '30'
          issue-comment: 'This issue has been automatically locked due to inactivity.'
          pr-comment: 'This PR has been automatically locked due to inactivity.'
