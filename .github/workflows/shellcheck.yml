name: shellcheck
on:
  push:
    branches: [ main ]
    paths:
      - '**/*.sh'
      - 'scripts/**'
  pull_request:
    paths:
      - '**/*.sh'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shopt -s globstar
          shellcheck -x **/*.sh | cat
