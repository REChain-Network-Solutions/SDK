repository:
  name: SDK
  description: "SDK monorepo with Rust workspace and automation"
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

labels:
  - name: bug
    color: d73a4a
  - name: enhancement
    color: a2eeef
  - name: task
    color: 0366d6
  - name: security
    color: ee0701
  - name: skip-changelog
    color: ffffff

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - CI
          - pre-commit
          - commitlint
          - cspell
